<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LuRa IT Develop – Programming Hero Animation</title>
<style>
  :root {
    --lura-primary: #1B242A;
    --lura-secondary: #5C7078;
    --lura-accent: #2CCFC8;
    --lura-accent-400: #61DBD6;
    --lura-accent-700: #219B96;
    --lura-ice: #F3FAFA;
    --lura-border: #DDE5E5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--lura-ice);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .lura-animation {
    width: min(500px, 92vw);
    aspect-ratio: 1;
    position: relative;
    isolation: isolate;
  }

  .lura-animation svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .grid {
    opacity: .45;
  }

  .orbit {
    transform-box: fill-box;
    transform-origin: center;
  }

  .orbit--slow { animation: spin 26s linear infinite; }
  .orbit--reverse { animation: spinReverse 34s linear infinite; }

  .data-path {
    fill: none;
    stroke: var(--lura-accent);
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: .44;
    stroke-dasharray: 4 10;
    animation: dashFlow 5.5s linear infinite;
  }

  .data-path.muted {
    stroke: var(--lura-secondary);
    opacity: .26;
    animation-duration: 8s;
  }

  .node {
    fill: var(--lura-ice);
    stroke: var(--lura-accent);
    stroke-width: 1.5;
    transform-box: fill-box;
    transform-origin: center;
    animation: nodePulse 2.8s ease-in-out infinite;
  }

  .node.muted {
    stroke: var(--lura-secondary);
    animation-delay: -1.2s;
  }

  .code-token {
    font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    font-weight: 700;
    fill: var(--lura-primary);
    opacity: .72;
    animation: tokenFloat 4.8s ease-in-out infinite;
  }

  .code-token.accent {
    fill: var(--lura-accent-700);
    opacity: .9;
  }

  .terminal {
    transform-box: fill-box;
    transform-origin: center;
    animation: terminalFloat 6s ease-in-out infinite;
  }

  .terminal-line {
    stroke-linecap: round;
    animation: terminalType 3.6s ease-in-out infinite;
  }

  .terminal-line:nth-child(2) { animation-delay: -.6s; }
  .terminal-line:nth-child(3) { animation-delay: -1.2s; }
  .terminal-line:nth-child(4) { animation-delay: -1.8s; }

  .logo {
    opacity: 0;
    animation: logoReveal .55s ease-out .18s forwards;
  }

  .scan {
    opacity: .35;
    animation: scanMove 4.8s ease-in-out infinite;
  }

  .parallax-far {
    transform: translate(var(--far-x, 0px), var(--far-y, 0px));
    transition: transform .18s ease-out;
  }

  .parallax-near {
    transform: translate(var(--near-x, 0px), var(--near-y, 0px));
    transition: transform .18s ease-out;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes spinReverse {
    to { transform: rotate(-360deg); }
  }

  @keyframes dashFlow {
    to { stroke-dashoffset: -56; }
  }

  @keyframes nodePulse {
    0%, 100% { transform: scale(.88); opacity: .5; }
    50% { transform: scale(1.18); opacity: 1; }
  }

  @keyframes tokenFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  @keyframes terminalFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(7px); }
  }

  @keyframes terminalType {
    0%, 18% { stroke-dasharray: 0 80; }
    45%, 82% { stroke-dasharray: 80 0; }
    100% { stroke-dasharray: 0 80; }
  }

  @keyframes logoReveal {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes scanMove {
    0%, 100% { transform: translateY(-18px); opacity: .05; }
    50% { transform: translateY(18px); opacity: .34; }
  }

  @media (max-width: 420px) {
    .code-token { opacity: .62; }
    .data-path { stroke-width: 1.6; }
  }

  @media (prefers-reduced-motion: reduce) {
    .lura-animation *, .lura-animation *::before, .lura-animation *::after {
      animation: none !important;
      transition: none !important;
    }
    .logo { opacity: 1; }
  }
</style>
</head>

<script>
(() => {
  const root = document.getElementById('luraAnimation');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!reduce && window.matchMedia('(pointer:fine)').matches) {
    root.addEventListener('pointermove', (e) => {
      const r = root.getBoundingClientRect();
      const x = ((e.clientX - r.left) / r.width - 0.5);
      const y = ((e.clientY - r.top) / r.height - 0.5);

      root.style.setProperty('--far-x', `${x * 4}px`);
      root.style.setProperty('--far-y', `${y * 4}px`);
      root.style.setProperty('--near-x', `${x * 8}px`);
      root.style.setProperty('--near-y', `${y * 8}px`);
    });

    root.addEventListener('pointerleave', () => {
      root.style.removeProperty('--far-x');
      root.style.removeProperty('--far-y');
      root.style.removeProperty('--near-x');
      root.style.removeProperty('--near-y');
    });
  }
})();
</script>
